<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#04043a" />
    <meta name="description" content="Type a jersey number, see the player." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roster" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Roster Lookup</title>
    <script>
      /*
       * iOS 16.4+ reads this manifest when you Add to Home Screen, and pins the
       * shortcut to its start_url — a fixed path, baked at build time, which
       * cannot carry anyone's share code. A phone installing from a share link
       * therefore launched at the bare path, in the separate storage jar iOS
       * gives a home-screen web app, with no roster and no way to find one.
       *
       * Dropping the manifest on iOS restores the older behaviour: the shortcut
       * records the page you were actually on, code and all. Nothing is lost —
       * on iOS the name, icon, colour and standalone display all come from the
       * apple-* meta tags above, not from here. Android keeps the manifest,
       * where it is needed and where storage isn't partitioned anyway.
       */
      (function () {
        var ua = navigator.userAgent;
        var iOS = /iP(hone|od|ad)/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
        if (iOS) document.querySelector('link[rel="manifest"]')?.remove();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
