<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#04043a" />
    <meta name="description" content="Type a jersey number, see the player." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roster" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Roster Lookup</title>
    <script>
      /*
       * The manifest is attached here rather than written in the markup above,
       * because iOS must never see one at all.
       *
       * iOS 16.4+ reads a web app manifest when you Add to Home Screen and pins
       * the shortcut to its start_url — a fixed path, baked at build time,
       * which cannot carry anyone's share code. The installed app then opened
       * at a bare address, in the separate storage jar iOS gives a home-screen
       * web app, with no roster and no way to find one.
       *
       * This was tried once as a <link> in the markup that a script deleted a
       * few lines later, and it did not hold: by the time any script runs,
       * Safari has already begun with a manifest it saw during parsing, and
       * removing the tag afterwards does not take it back. Never writing the
       * tag is the only version that cannot lose that race.
       *
       * Nothing is given up on iOS — the name, icon, colour and standalone
       * display all come from the apple-* meta tags above. Android and desktop
       * get the manifest, where it is needed and where storage isn't
       * partitioned anyway.
       */
      (function () {
        var ua = navigator.userAgent;
        var iOS = /iP(hone|od|ad)/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
        if (iOS) return;
        var link = document.createElement('link');
        link.rel = 'manifest';
        // Relative, so each team's page picks up its own manifest.
        link.href = './manifest.webmanifest';
        document.head.appendChild(link);
      })();
    </script>
    <script>
      /*
       * How many people opened this, and nothing else.
       *
       * Cloudflare Web Analytics: no cookie, no device fingerprint, no
       * identifier that follows anyone between sites. It reports a page view
       * and the referrer, and it never sees a roster — those live in browser
       * storage and are not on the page as anything a script off another
       * origin could read.
       *
       * Attached by script rather than written as a tag so an unset token is a
       * no-op instead of a broken request. Vite substitutes the value at build
       * time; with nothing to substitute the placeholder survives verbatim,
       * which is what the '%' check catches — a local `npm run dev`, or anyone
       * who forks this, gets no beacon at all rather than a 404 to a stranger's
       * analytics.
       *
       * The token is not a secret. It ships in the page for anyone to read, the
       * same way the Supabase anon key does, and for the same reason it is a
       * repository *variable* and not a repository secret.
       */
      (function () {
        var token = '%VITE_CF_BEACON%';
        if (!token || token.charAt(0) === '%') return;

        var s = document.createElement('script');
        s.defer = true;
        s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        s.setAttribute('data-cf-beacon', JSON.stringify({ token: token }));
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
