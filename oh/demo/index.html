<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#04043a" />
    <meta name="description" content="Poland Seminary — what a school gets when it signs up." />
    <title>Poland Seminary — a demo</title>
    <!--
      No manifest and no service worker registration, deliberately.

      The root app registers a worker whose navigation fallback is bound to
      Poland's index.html, and a second worker on the same origin is a way to
      break the first. This page caches what it needs in localStorage instead,
      which is enough: the school a reader picks is a few kilobytes.

      This page lives under /oh/ for a second reason of its own. The root
      worker's navigateFallbackDenylist is exactly /^\/oh(\/|$)/ and the
      precache ignores **/oh/**, both of which scripts/check-untouched.mjs
      asserts to the letter — so a demo at /demo would mean editing the one
      alarm this repo has. Inside /oh/ it needs neither changed.
    -->
    <!-- The paid page dresses itself through applyLook; without this override,
         the root app's own wallpaper would otherwise sit behind it. -->
    <style>
      :root {
        --wallpaper: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/oh/main.tsx"></script>
  </body>
</html>
