name: Refresh the Ohio directory

# Ohio plays on a Friday night. This runs early Saturday for the scores, and
# again on Wednesday to pick up a fixture that has moved. Sixteen requests a
# run against one person's hobby site, which is the whole budget.
#
# It commits to main, and that push is what triggers the deploy — so the data
# reaches the site through the ordinary route rather than a second publisher.
on:
  schedule:
    - cron: '0 7 * * 6'
    - cron: '0 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a tag can be moved, a commit cannot. No credentials are
      # left in the checkout, so npm install scripts never see a write token; the
      # commit step below is the only place the token is handed over.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Exits non-zero if the fetch came back with too few schools, which keeps
      # the committed copy rather than deleting schools people have bookmarked.
      - run: npm run directory

      # The playoff rankings for the regions that hold a paying school — one
      # or two requests more. It keeps the committed table when a page will not
      # load and exits clean either way; the guard on the step is for a crash,
      # which must not stop the state's scores being committed.
      - run: node scripts/build-regions.mjs
        continue-on-error: true

      - name: Commit whatever changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/oh/
          if git diff --staged --quiet; then
            echo "No change in the state's scores."
            exit 0
          fi
          git commit -m "Ohio scores, $(date -u +%Y-%m-%d)"
          # Someone may have pushed to main while this run was fetching.
          git pull --rebase
          git push
