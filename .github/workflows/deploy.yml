name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The same forecast pass the refresh runs, for the same reason it runs
      # there: whatever is in public/oh/weather.json at build time is what the
      # deploy carries, and the refresh's fresh copy never leaves its own run.
      # Without this every push — and the directory refresh's twice-weekly
      # commit to main, which lands here too — would redeploy a file whose
      # dates match no fixture, and the kickoff forecast would quietly vanish
      # from every paying page until the next six-hourly refresh. Fail-soft on
      # the same terms: the script never exits non-zero, and continue-on-error
      # is the belt to that brace.
      - run: node scripts/paid-weather.mjs
        continue-on-error: true
      - run: npm run build
        # Repository *variables*, not secrets. Every one of these ends up
        # readable in the shipped bundle by design, and storing them as secrets
        # would only make them harder to check without making them any less
        # public. Leave any of them unset and the feature it belongs to turns
        # itself off rather than half-working.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_CF_BEACON: ${{ vars.VITE_CF_BEACON }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
