name: Refresh the schedule

# The season comes from the school's calendar feed, which the build reads and
# bakes in. Nothing on a phone can fetch it — no CORS header — so a rebuild is
# what carries a fixture change or a final score through to everyone. Every six
# hours keeps a Friday night result current by Saturday morning without anyone
# remembering to do anything.
#
# The site is built by Cloudflare Pages, which rebuilds on a push and on
# nothing else, and this refresh has nothing to push: the point is a rebuild of
# the same commit against newer data. A deploy hook is how Cloudflare is asked
# for one. Its build runs the same fetches a push does — the paying schools'
# kickoff forecast, then Poland's schedule, league and weather — behind the same
# tests and the same guard.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
    steps:
      # A missing secret fails the run rather than skipping it. This job is the
      # whole refresh now, so a quiet skip would be a site that stops updating
      # with every run green.
      - run: |
          if [ -z "$HOOK" ]; then
            echo "::error::CF_PAGES_DEPLOY_HOOK is not set, so nothing asked Cloudflare to rebuild."
            exit 1
          fi
          curl -fsS --retry 3 --retry-all-errors -X POST "$HOOK" -o /dev/null
